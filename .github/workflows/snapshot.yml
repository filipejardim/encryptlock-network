# Every 10 minutes: a snapshot of the EncryptLock network's public data
# (snapshot.mjs) published on GitHub Pages for outside tools.
name: Network snapshot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the network
        run: node snapshot.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      # GitHub stops scheduled runs after 60 days without a commit: one empty
      # commit a month keeps it going without anyone.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the snapshot schedule alive"
            git push
          fi
